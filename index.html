<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f7fb">
  <title>开学学习打卡</title>
  <style>
    :root{
      --ink:#172033;--muted:#667085;--line:#dce3ec;--paper:#f5f7fb;--panel:#fff;
      --green:#16a34a;--blue:#2563eb;--gold:#f59e0b;--red:#dc2626;
    }
    *{box-sizing:border-box}
    html{background:var(--paper);color:var(--ink)}
    body{margin:0;font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",Arial,sans-serif;letter-spacing:0}
    button,input{font:inherit}
    button{-webkit-tap-highlight-color:transparent}
    main{width:min(760px,100%);margin:0 auto;padding:18px 16px 44px}
    h1,h2,h3,p{margin-top:0}
    h1{margin-bottom:0;font-size:36px;line-height:1.08}
    h2{margin-bottom:0;font-size:25px}
    .topbar{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;padding:18px 2px 10px}
    .kicker{margin:0 0 6px;color:var(--muted);font-size:13px;font-weight:800}
    .badge,.smallPill,.balance{border-radius:999px;background:#fff4cf;color:var(--ink);font-weight:900;white-space:nowrap}
    .badge{padding:11px 16px;font-size:16px}
    .accountGrid{display:grid;gap:12px;margin-top:16px}
    .account{
      position:relative;width:100%;display:grid;gap:14px;border:1px solid var(--line);border-radius:8px;
      background:var(--soft);padding:16px;color:inherit;text-align:left;cursor:pointer;overflow:hidden;
      box-shadow:0 8px 26px rgba(23,32,51,.05)
    }
    .account::before{
      content:"";position:absolute;inset:0;background-image:var(--character);background-repeat:no-repeat;
      background-position:right bottom;background-size:52% auto;opacity:.52;filter:saturate(1.12);pointer-events:none
    }
    .account::after{
      content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(255,255,255,.92) 0%,rgba(255,255,255,.78) 56%,rgba(255,255,255,.42) 100%);
      pointer-events:none
    }
    .account>*{position:relative;z-index:1}
    .account.active{border-color:var(--accent);box-shadow:0 10px 28px rgba(23,32,51,.08),0 0 0 1px var(--accent)}
    .accountTop{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center}
    .dot{width:42px;height:42px;border-radius:50%;background:var(--accent);box-shadow:0 8px 18px rgba(23,32,51,.12)}
    .accountTitle strong{display:block;font-size:22px;line-height:1.15}
    .accountTitle small{display:block;margin-top:4px;color:var(--muted);font-size:12px;font-weight:800}
    .balance{padding:8px 12px;font-size:14px}
    .accountStats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
    .accountStat{border:1px solid rgba(102,112,133,.14);border-radius:8px;background:rgba(255,255,255,.72);padding:9px 10px}
    .accountStat span{display:block;color:var(--muted);font-size:12px;font-weight:800;line-height:1.25}
    .accountStat b{display:block;margin-top:3px;color:var(--accent);font-size:19px;line-height:1}
    .accountProgress{display:grid;gap:7px}
    .accountProgressHeader{display:flex;align-items:center;justify-content:space-between;gap:10px;color:var(--muted);font-size:12px;font-weight:900}
    .accountProgressHeader b{color:var(--accent);font-size:18px}
    .bar{height:9px;border-radius:999px;overflow:hidden;background:#e5e7eb}
    .bar em{display:block;height:100%;border-radius:inherit;background:var(--accent)}
    .dateCard{
      position:sticky;top:0;z-index:5;display:grid;grid-template-columns:46px 1fr 46px;gap:10px;align-items:center;
      margin:16px 0;padding:10px;border:1px solid var(--line);border-radius:8px;background:rgba(255,255,255,.96);backdrop-filter:blur(10px)
    }
    .dateCard button{height:44px;border:0;border-radius:8px;background:#eef2f7;color:var(--ink);font-size:30px;line-height:1}
    .dateCard div{text-align:center}
    .dateCard span{display:block;color:var(--muted);font-size:12px;font-weight:800}
    .dateCard strong{display:block;margin-top:2px;font-size:18px}
    .card{margin-top:14px;border:1px solid var(--line);border-radius:8px;background:var(--panel);padding:16px;box-shadow:0 8px 26px rgba(23,32,51,.05)}
    .sectionTitle{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:14px}
    .todayScore{text-align:right}
    .todayScore strong{display:block;color:var(--green);font-size:24px}
    .todayScore span{color:var(--muted);font-size:12px;font-weight:800}
    .taskList{display:grid;gap:10px}
    .taskItem{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;border:1px solid #e5e9f0;border-radius:8px;background:#fff;padding:12px}
    .taskItem.done{border-color:#86efac;background:#f0fdf4}
    .taskItem.optional{border-style:dashed}
    .taskItem button{width:34px;height:34px;border:2px solid var(--green);border-radius:50%;background:#fff;color:#fff;font-weight:900}
    .taskItem.done button{background:var(--green)}
    .taskItem strong{display:block;font-size:17px;line-height:1.25}
    .taskItem p{margin:4px 0 0;color:var(--muted);font-size:13px;line-height:1.45}
    .taskItem span{color:var(--gold);font-weight:900;white-space:nowrap}
    .smallPill{padding:8px 12px;color:var(--gold);font-size:13px}
    .spendForm{display:grid;grid-template-columns:128px 1fr;gap:10px}
    .spendForm label{display:grid;gap:6px;color:var(--muted);font-size:13px;font-weight:800}
    .spendForm input{width:100%;min-height:44px;border:1px solid var(--line);border-radius:8px;background:#f8fafc;color:var(--ink);padding:0 12px}
    .spendForm button{grid-column:1/3;min-height:46px;border:0;border-radius:8px;background:var(--ink);color:#fff;font-weight:900}
    .spendList{display:grid;gap:8px;margin-top:12px}
    .spendRow{display:grid;grid-template-columns:84px 58px 1fr 48px 48px;gap:8px;align-items:center;color:var(--muted);font-size:12px}
    .spendRow strong{color:var(--red)}
    .spendRow em{color:var(--ink);font-style:normal;font-weight:800}
    .spendRow button{min-height:32px;border:0;border-radius:8px;background:#fee2e2;color:#b91c1c;font-size:12px;font-weight:800}
    .spendRow button.edit{background:#e0ecff;color:#1d4ed8}
    .voided{opacity:.62;text-decoration:line-through}
    .history{grid-column:3/6;color:var(--muted);font-size:11px;line-height:1.4}
    .spendList p,.helperText{margin:0;color:var(--muted);font-size:13px;line-height:1.5}
    .homeworkList{display:grid;gap:10px;margin:0;padding-left:20px;color:var(--ink);line-height:1.55}
    .planList{display:grid;gap:8px}
    details{border:1px solid #e5e9f0;border-radius:8px;background:#fff;overflow:hidden}
    summary{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:50px;padding:0 12px;cursor:pointer;font-weight:900;list-style:none}
    summary::-webkit-details-marker{display:none}
    summary b{color:var(--green)}
    details ol{margin:0;padding:0 16px 14px 36px;color:var(--muted);line-height:1.55}
    details li+li{margin-top:6px}
    .note{margin-top:14px;border-radius:8px;background:#172033;color:#fff;padding:16px}
    .note strong{display:block;margin-bottom:8px;font-size:18px}
    .note p{margin:0;color:#dbe4ef;line-height:1.6}
    .note p+p{margin-top:8px}
    .machine{display:grid;gap:10px}
    .slotGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .slot{border:1px solid #e5e9f0;border-radius:8px;background:#f8fafc;padding:12px}
    .slot b{display:block;font-size:18px}
    .slot span{display:block;margin-top:4px;color:var(--muted);font-size:13px;font-weight:800}
    @media (min-width:700px){main{padding-top:28px}.accountGrid{grid-template-columns:1fr 1fr}}
    @media (max-width:420px){
      main{padding-left:12px;padding-right:12px}h1{font-size:34px}.account{padding:14px}
      .accountTop{grid-template-columns:38px 1fr}.dot{width:36px;height:36px}.balance{grid-column:2;justify-self:start}
      .accountStats{grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}.accountStat{padding:8px}
      .account::before{background-size:68% auto;opacity:.45}.spendForm,.spendForm button{grid-template-columns:1fr;grid-column:auto}
      .spendRow{grid-template-columns:1fr auto}.spendRow em,.spendRow button,.history{grid-column:span 2}.slotGrid{grid-template-columns:1fr}
    }
  </style>
</head>
<body>
  <main id="app"></main>
  <script>
    const storageKey="summer-homework-checkin-github-pages-v1";
    const termPrefix="school-2026-september-v1";
    const childInfo={
      grade3:{
        name:"四年级4班",shortName:"四年级",color:"#16a34a",bg:"#ecfdf3",
        image:"https://upload.wikimedia.org/wikipedia/en/thumb/e/ea/Tanjirou_manga.png/250px-Tanjirou_manga.png",
        note:"每日基础满星6★。连续奖励只按6项基础任务计算。"
      },
      grade4:{
        name:"五年级5班",shortName:"五年级",color:"#2563eb",bg:"#eef6ff",
        image:"https://episodehive.com/image/wwMl9AWW2NwTpYjYxoIeqEpdp0p.jpg",
        note:"每日基础满星6★。钢琴是可选加星，不参与连续满星判定。"
      }
    };
    const fixedInitialStars={grade3:-10,grade4:103};
    const startDate=new Date("2026-09-01T00:00:00+08:00");
    const planDays=30;
    const todayIndex=getTodayIndex();
    const baseTasks=[
      {
        id:"school-homework",
        title:"学校作业 + 作业计划",
        detail:"开始前先看清当天学校作业，按语文、数学、英语、其他科目排顺序；每完成一项打勾。完成标准：学校书面和口头作业全部完成，明天要交的资料放进书包。"
      },
      {
        id:"math-corrections-xueba",
        title:"错题订正 + 五星学霸数学同步15-25分钟",
        detail:"先订正当天数学错题1-3道；再按学校进度完成《五星学霸》对应内容约1页。错题较多时，只完成错题订正也算完成；不提前赶进度。"
      },
      {
        id:"english-machine-words",
        title:"英语单词打卡30分钟",
        detail:"在学习机上完成。单词大声朗读2遍，例句朗读1遍，再拼写单词1遍；错词每个改写3遍，家长抽查5个词，至少答对4个。"
      },
      {
        id:"reading",
        title:"课外阅读20-30分钟",
        detail:"安静阅读20-30分钟。完成标准：能说出今天读了哪一段、一个人物或一个关键内容；不要求每天写摘抄。"
      },
      {
        id:"sport",
        title:"运动1项",
        detail:"完成1项运动，可选跳绳、跑步、球类、体能训练或学校体育要求。完成标准：连续运动不少于15分钟，结束后做简单拉伸。"
      },
      {
        id:"attitude-organization",
        title:"按时开始 / 不拖拉 + 书桌书包整理",
        detail:"按家庭约定时间开始，中途不无故离开；不会的题先标记再求助。结束后清理书桌，把明天课本、作业、文具和水杯放进书包。"
      }
    ];
    const optionalPiano={
      id:"piano",
      title:"钢琴练习30分钟",
      detail:"五年级可选加星项。完成30分钟钢琴练习，重点保持坐姿、手型和节奏稳定；完成可得1★，但不计入连续满星判定。",
      required:false
    };
    const plans=buildPlans();
    const fullHomework={
      grade3:[
        "每日完成学校作业并做开始前计划，结束后确认明天需交材料。",
        "每日先订正当天数学错题，再结合学校进度完成《五星学霸》数学同步约1页；错题多时以订正为优先。",
        "每日学习机英语单词打卡30分钟：朗读单词、朗读例句、拼写单词、订正错词。",
        "每日课外阅读20-30分钟，能口头复述当天阅读内容。",
        "每日完成1项运动，不少于15分钟。",
        "每日按时开始、不拖拉，完成后整理书桌和书包。"
      ],
      grade4:[
        "每日完成学校作业并做开始前计划，结束后确认明天需交材料。",
        "每日先订正当天数学错题，再结合学校进度完成《五星学霸》数学同步约1页；错题多时以订正为优先。",
        "每日学习机英语单词打卡30分钟：朗读单词、朗读例句、拼写单词、订正错词。",
        "每日课外阅读20-30分钟，能口头复述当天阅读内容。",
        "每日完成1项运动，不少于15分钟。",
        "每日按时开始、不拖拉，完成后整理书桌和书包。",
        "钢琴练习30分钟为五年级可选加星项，可每天做，但不参与连续满星判定。"
      ]
    };
    function buildPlans(){
      const list=[];
      for(let i=0;i<planDays;i++){
        const date=new Date(startDate.getTime()+i*86400000);
        const day=date.getDay();
        const weekday=["周日","周一","周二","周三","周四","周五","周六"][day];
        list.push({
          date:`${date.getMonth()+1}月${date.getDate()}日`,
          weekday,
          iso:date.toISOString().slice(0,10),
          grade3:baseTasks.map(t=>Object.assign({required:true},t)),
          grade4:[...baseTasks.map(t=>Object.assign({required:true},t)),optionalPiano]
        });
      }
      return list;
    }
    function defaultState(){
      return{checked:{},checkedUpdatedAt:{},spends:{grade3:[],grade4:[]},parentCode:"",carryoverStars:null,schoolCarryoverV1:false,schoolBalanceResetV2:false,updatedAt:0};
    }
    function normalizeState(input){
      const s=Object.assign(defaultState(),input||{});
      s.checked=s.checked||{};
      s.checkedUpdatedAt=s.checkedUpdatedAt||{};
      s.spends=s.spends||{};
      ["grade3","grade4"].forEach(child=>{
        s.spends[child]=(s.spends[child]||[]).map(item=>Object.assign({
          id:String(Date.now())+"-"+Math.random().toString(36).slice(2),
          date:"",
          stars:0,
          note:"",
          createdAt:s.updatedAt||Date.now(),
          updatedAt:s.updatedAt||Date.now(),
          history:[]
        },item));
      });
      Object.keys(s.checked).forEach(k=>{if(!s.checkedUpdatedAt[k])s.checkedUpdatedAt[k]=s.updatedAt||Date.now()});
      resetOpeningBalances(s);
      migrateCarryover(s);
      return s;
    }
    function resetOpeningBalances(s){
      if(s.schoolBalanceResetV2)return;
      s.spends={grade3:[],grade4:[]};
      s.carryoverStars=Object.assign({},fixedInitialStars);
      s.schoolCarryoverV1=true;
      s.schoolBalanceResetV2=true;
    }
    function migrateCarryover(s){
      if(s.schoolCarryoverV1&&s.carryoverStars)return;
      s.carryoverStars=Object.assign({},fixedInitialStars);
      s.schoolCarryoverV1=true;
    }
    function loadState(){
      try{
        const loaded=normalizeState(JSON.parse(localStorage.getItem(storageKey)||"{}"));
        localStorage.setItem(storageKey,JSON.stringify(loaded));
        return loaded;
      }catch{
        const fresh=defaultState();
        localStorage.setItem(storageKey,JSON.stringify(fresh));
        return fresh;
      }
    }
    let state=loadState();
    let activeChild="grade3";
    let dayIndex=todayIndex;
    let spendStars="";
    let spendNote="";
    function getTodayIndex(){
      const day=Math.floor((Date.now()-startDate.getTime())/86400000);
      return Math.min(planDays-1,Math.max(0,day));
    }
    function keyOf(child,index,id){return `${termPrefix}:${child}:${index}:${id}`}
    function save(){
      state=normalizeState(state);
      state.updatedAt=Date.now();
      localStorage.setItem(storageKey,JSON.stringify(state));
    }
    function requiredTasks(child,index){return plans[index][child].filter(t=>t.required!==false)}
    function allTasks(child){return plans.flatMap(p=>p[child])}
    function allRequiredTasks(child){return plans.flatMap(p=>p[child].filter(t=>t.required!==false))}
    function checkedCount(child,onlyRequired=false){
      let count=0;
      plans.forEach((p,i)=>p[child].forEach(t=>{
        if(onlyRequired&&t.required===false)return;
        if(state.checked[keyOf(child,i,t.id)])count++;
      }));
      return count;
    }
    function dayDone(child,index,onlyRequired=false){
      return plans[index][child].filter(t=>(!onlyRequired||t.required!==false)&&state.checked[keyOf(child,index,t.id)]).length;
    }
    function isFullRequiredDay(child,index){
      const total=requiredTasks(child,index).length;
      return total>0&&dayDone(child,index,true)===total;
    }
    function persistenceRewards(child){
      let streak=0,total=0,currentStreak=0;
      const items=[];
      plans.forEach((p,i)=>{
        if(i>todayIndex)return;
        if(isFullRequiredDay(child,i)){
          streak++;
          let stars=0,reasons=[];
          if(streak%3===0){stars+=1;reasons.push("连续3天基础项满星")}
          if(streak%7===0){stars+=3;reasons.push("连续7天基础项满星")}
          if(stars){total+=stars;items.unshift({date:p.date+" "+p.weekday,stars,reason:reasons.join(" + "),streak})}
        }else{
          streak=0;
        }
        if(i===todayIndex)currentStreak=streak;
      });
      return{total,items,currentStreak};
    }
    function spendTotal(child){
      return(state.spends[child]||[]).reduce((sum,item)=>sum+(item.voidedAt?0:Number(item.stars)||0),0);
    }
    function stats(child){
      const completed=checkedCount(child,false);
      const total=allTasks(child).length;
      const requiredCompleted=checkedCount(child,true);
      const requiredTotal=allRequiredTasks(child).length;
      const bonus=persistenceRewards(child);
      const spent=spendTotal(child);
      const initial=(state.carryoverStars&&Number.isFinite(Number(state.carryoverStars[child])))?Number(state.carryoverStars[child]):(fixedInitialStars[child]||0);
      const earned=completed+bonus.total;
      return{
        initial,baseEarned:completed,bonus:bonus.total,bonusItems:bonus.items,currentStreak:bonus.currentStreak,
        earned,spent,balance:initial+earned-spent,completed,total,requiredCompleted,requiredTotal,
        percent:total?Math.round(completed/total*100):0
      };
    }
    function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]))}
    function askParent(action){
      if(!state.parentCode){
        const first=prompt(`${action}\n请先设置家长口令，至少4位。`);
        if(!first||first.length<4){alert("家长口令至少4位。");return false}
        const second=prompt("请再次输入家长口令确认。");
        if(first!==second){alert("两次口令不一致。");return false}
        state.parentCode=first;
        save();
        alert("家长口令已设置。");
        return true;
      }
      const code=prompt(`${action}\n请输入家长口令。`);
      if(code!==state.parentCode){alert("家长口令不正确。");return false}
      return true;
    }
    function machineOrder(index){
      const date=new Date(startDate.getTime()+index*86400000);
      const even=date.getDate()%2===0;
      return even?["四年级4班","五年级5班"]:["五年级5班","四年级4班"];
    }
    function render(){
      const info=childInfo[activeChild], plan=plans[dayIndex], tasks=plan[activeChild], st3=stats("grade3"), st4=stats("grade4");
      const requiredDone=dayDone(activeChild,dayIndex,true);
      const requiredTotal=requiredTasks(activeChild,dayIndex).length;
      const allDone=dayDone(activeChild,dayIndex,false);
      const order=machineOrder(dayIndex);
      document.getElementById("app").innerHTML=`
        <header class="topbar">
          <div><p class="kicker">${plans.length}天计划 · ${plans[0].date}-${plans[plans.length-1].date}</p><h1>开学学习打卡</h1></div>
          <span class="badge">本机保存</span>
        </header>
        <section class="accountGrid" aria-label="孩子账户">${accountHtml("grade3",st3)}${accountHtml("grade4",st4)}</section>
        <section class="card machine">
          <div class="sectionTitle"><div><p class="kicker">学习机轮流</p><h2>固定两个时段</h2></div><span class="smallPill">${plan.date}</span></div>
          <div class="slotGrid">
            <div class="slot"><b>18:30-19:00</b><span>${order[0]} 使用学习机</span></div>
            <div class="slot"><b>19:00-19:30</b><span>${order[1]} 使用学习机</span></div>
          </div>
          <p class="helperText">未使用学习机的孩子先完成学校作业、错题订正或阅读，减少等待和争抢。</p>
        </section>
        <section class="dateCard">
          <button data-action="prev" aria-label="前一天">‹</button>
          <div><span>第${dayIndex+1}天</span><strong>${plan.date} ${plan.weekday}</strong></div>
          <button data-action="next" aria-label="后一天">›</button>
        </section>
        <section class="card">
          <div class="sectionTitle">
            <div><p class="kicker">${info.name}</p><h2>今日打卡</h2></div>
            <div class="todayScore"><strong>${requiredDone}/${requiredTotal}</strong><span>基础满星${requiredTotal}★${activeChild==="grade4"?"，钢琴另+1★":""}</span></div>
          </div>
          <div class="taskList">${tasks.map(taskHtml).join("")}</div>
        </section>
        ${persistenceHtml()}
        <section class="card spendCard">
          <div class="sectionTitle"><div><p class="kicker">${info.name}</p><h2>今日消费</h2></div><span class="smallPill">完整保留记录</span></div>
          <div class="spendForm">
            <label>使用星星数<input inputmode="numeric" id="spendStars" value="${esc(spendStars)}" placeholder="例：5"></label>
            <label>使用途径<input id="spendNote" placeholder="例：20分钟动画" value="${esc(spendNote)}"></label>
            <button data-action="addSpend">记录消费</button>
          </div>
          <div class="spendList">${spendHtml()}</div>
          <p class="helperText">修改或作废消费记录需要家长口令；作废后记录仍保留，只是不再计入累计消费。</p>
        </section>
        <section class="card">
          <div class="sectionTitle"><div><p class="kicker">完整清单</p><h2>本月任务说明</h2></div></div>
          <ul class="homeworkList">${fullHomework[activeChild].map(i=>`<li>${esc(i)}</li>`).join("")}</ul>
        </section>
        <section class="card">
          <div class="sectionTitle"><div><p class="kicker">${plans.length}天安排</p><h2>每日任务详情</h2></div></div>
          <div class="planList">${plans.map(planHtml).join("")}</div>
        </section>
        <section class="note">
          <strong>奖励和权限规则</strong>
          <p>每日每项完成得1★。四年级基础满星6★；五年级基础满星6★，钢琴练习可额外得1★，但不参与连续满星判定。</p>
          <p>连续3天基础项满星额外+1★，连续7天基础项满星额外+3★，可叠加。过期补打卡、修改过去日期打卡、修改或作废消费记录均需家长口令。</p>
          <p>数据只保存在当前设备浏览器内，不再使用云端同步。</p>
        </section>`;
      bind();
    }
    function accountHtml(child,st){
      const i=childInfo[child];
      const statsRows=[
        ["初始余额",st.initial+"★"],
        ["任务获得",st.baseEarned+"★"],
        ["持之以恒",st.bonus+"★"],
        ["累计获得",st.earned+"★"],
        ["累计消费",st.spent+"★"]
      ].filter(Boolean);
      return`<button class="account ${activeChild===child?"active":""}" data-child="${child}" style="--accent:${i.color};--soft:${i.bg};--character:url('${i.image}')">
        <div class="accountTop">
          <span class="dot"></span>
          <span class="accountTitle"><strong>${i.name}</strong><small>${st.completed}/${st.total}项已完成 · 基础${st.requiredCompleted}/${st.requiredTotal}</small></span>
          <span class="balance">余额 ${st.balance}★</span>
        </div>
        <div class="accountStats">${statsRows.map(([label,value])=>`<span class="accountStat"><span>${label}</span><b>${value}</b></span>`).join("")}</div>
        <div class="accountProgress"><span class="accountProgressHeader"><span>任务进度</span><b>${st.percent}%</b></span><i class="bar"><em style="width:${st.percent}%"></em></i></div>
      </button>`;
    }
    function taskHtml(t){
      const done=state.checked[keyOf(activeChild,dayIndex,t.id)];
      const optional=t.required===false;
      return`<article class="taskItem ${done?"done":""} ${optional?"optional":""}">
        <button data-task="${esc(t.id)}" aria-label="${done?"取消":"完成"}${esc(t.title)}">${done?"✓":""}</button>
        <div><strong>${esc(t.title)}${optional?"（可选）":""}</strong><p>${esc(t.detail)}</p></div>
        <span>+1★</span>
      </article>`;
    }
    function persistenceHtml(){
      const st=stats(activeChild),items=st.bonusItems.slice(0,8);
      return`<section class="card">
        <div class="sectionTitle"><div><p class="kicker">${childInfo[activeChild].name}</p><h2>持之以恒奖励</h2></div><span class="smallPill">累计+${st.bonus}★</span></div>
        <div class="spendList">${items.length?items.map(i=>`<div class="spendRow"><span>${esc(i.date)}</span><strong>+${i.stars}★</strong><em>${esc(i.reason)}</em><span>${i.streak}天</span></div>`).join(""):`<p>当前连续基础满星${st.currentStreak}天。连续3天+1★，连续7天+3★，可叠加。</p>`}</div>
      </section>`;
    }
    function spendHtml(){
      const list=(state.spends[activeChild]||[]).slice().sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
      if(!list.length)return"<p>还没有消费记录。</p>";
      return list.slice(0,30).map(i=>{
        const history=(i.history||[]).map(h=>`原记录：${h.stars}★，${h.note}`).join("；");
        return`<div class="spendRow ${i.voidedAt?"voided":""}">
          <span>${esc(i.date)}</span><strong>-${Number(i.stars)||0}★</strong><em>${esc(i.note)}${i.voidedAt?"（已作废）":""}</em>
          ${i.voidedAt?`<span></span><span></span>`:`<button class="edit" data-edit-spend="${esc(i.id)}">修改</button><button data-void-spend="${esc(i.id)}">作废</button>`}
          ${history?`<span class="history">${esc(history)}</span>`:""}
        </div>`;
      }).join("");
    }
    function planHtml(p,index){
      const done=dayDone(activeChild,index,false);
      return`<details ${index===dayIndex?"open":""}>
        <summary><span>第${index+1}天 · ${p.date} ${p.weekday}</span><b>${done}/${p[activeChild].length}</b></summary>
        <ol>${p[activeChild].map(t=>`<li>${esc(t.title)}${t.required===false?"（可选）":""}：${esc(t.detail)}</li>`).join("")}</ol>
      </details>`;
    }
    function findSpend(id){
      return(state.spends[activeChild]||[]).find(i=>String(i.id)===String(id));
    }
    function bind(){
      document.querySelectorAll("[data-child]").forEach(b=>b.onclick=()=>{activeChild=b.dataset.child;render()});
      document.querySelector('[data-action="prev"]').onclick=()=>{dayIndex=Math.max(0,dayIndex-1);render()};
      document.querySelector('[data-action="next"]').onclick=()=>{dayIndex=Math.min(plans.length-1,dayIndex+1);render()};
      document.querySelectorAll("[data-task]").forEach(b=>b.onclick=()=>{
        if(dayIndex>todayIndex){alert("不能提前打卡。");return}
        if(dayIndex<todayIndex&&!askParent("修改过去日期的打卡需要家长确认。"))return;
        const k=keyOf(activeChild,dayIndex,b.dataset.task);
        state.checked[k]=!state.checked[k];
        state.checkedUpdatedAt[k]=Date.now();
        save();
        render();
      });
      document.getElementById("spendStars").oninput=e=>{spendStars=e.target.value};
      document.getElementById("spendNote").oninput=e=>{spendNote=e.target.value};
      document.querySelector('[data-action="addSpend"]').onclick=()=>{
        const stars=parseInt(spendStars,10);
        if(!stars||stars<1||!spendNote.trim()){alert("请填写使用星星数和使用途径。");return}
        if(dayIndex<todayIndex&&!askParent("补记过去日期的消费需要家长确认。"))return;
        const now=Date.now();
        state.spends[activeChild]=[{id:`${termPrefix}-${activeChild}-${now}`,date:plans[dayIndex].date+" "+plans[dayIndex].weekday,stars,note:spendNote.trim(),createdAt:now,updatedAt:now,history:[]},...(state.spends[activeChild]||[])];
        spendStars="";
        spendNote="";
        save();
        render();
      };
      document.querySelectorAll("[data-edit-spend]").forEach(b=>b.onclick=()=>{
        const item=findSpend(b.dataset.editSpend);
        if(!item||item.voidedAt)return;
        if(!askParent("修改消费记录需要家长确认。"))return;
        const stars=parseInt(prompt("新的使用星星数：",String(item.stars)),10);
        const note=prompt("新的使用途径：",item.note);
        if(!stars||stars<1||!note||!note.trim()){alert("修改取消：星星数和用途都不能为空。");return}
        item.history=item.history||[];
        item.history.push({stars:item.stars,note:item.note,updatedAt:item.updatedAt||item.createdAt||Date.now()});
        item.stars=stars;
        item.note=note.trim();
        item.updatedAt=Date.now();
        save();
        render();
      });
      document.querySelectorAll("[data-void-spend]").forEach(b=>b.onclick=()=>{
        const item=findSpend(b.dataset.voidSpend);
        if(!item||item.voidedAt)return;
        if(!askParent("作废消费记录需要家长确认。"))return;
        item.voidedAt=Date.now();
        item.updatedAt=Date.now();
        save();
        render();
      });
    }
    render();
  </script>
</body>
</html>
