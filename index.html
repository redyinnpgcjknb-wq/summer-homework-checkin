      ["8月5日","周三",[d.g3Jump,d.g3Read,"阅读集训P39-40并订正|完成第39-40页。","必备内容书写P27|完成打印页第27页。","四上单词5-6|预习并默写四上单词5-6单元。",d.g3Machine,d.attitude],[d.g4Jump,d.g4Read,"数学错题订正1|集中订正数学错题第一轮。","必备内容书写P27|完成必备内容第27页。","完成作文《二十年后的家乡》|一天内完成整篇作文，完成后自查。",d.g4Machine,d.attitude]],
      ["8月6日","周四",[d.g3Jump,d.g3Read,"阅读集训P41并订正|完成第41页。","必备内容书写P28-29|完成第28-29页。","四上单词7-8|预习并默写四上单词7-8单元。",d.g3Machine,d.attitude],[d.g4Jump,d.g4Read,"数学错题订正2|集中订正数学错题第二轮。","必备内容书写P28-29|完成必备内容第28-29页。","作文检查|检查三篇作文标题、错字、标点和书写。",d.g4Machine,d.attitude]],
      ["8月7日","周五",[d.g3Jump,d.g3Read,"阅读集训P42并订正|完成第42页。","必备内容书写P30|完成打印页第30页。","四上单词总复习|复习四上预习单词，圈出不会的。",d.g3Machine,d.attitude],[d.g4Jump,d.g4Read,"数学综合练习|用错题类型做综合练习。","必备内容书写P30|完成必备内容第30页。","小古文5|完成六篇小古文中的第5篇。",d.g4Machine,d.attitude]],
      ["8月8日","周六",[d.g3Jump,d.g3Read,"阅读集训P43并订正|完成第43页。","必备内容书写P31|完成打印页第31页。","英语混合默写|混合默写三上、三下、四上预习内容。",d.g3Machine,d.attitude],[d.g4Jump,d.g4Read,"必备内容书写P31|完成必备内容第31页。","语文资料整理|整理古诗、作文、小古文和必备内容。",d.g4Machine,d.attitude]],
      ["8月9日","周日",[d.g3Jump,d.g3Read,"阅读集训P44并订正|完成阅读集训最后一页。","查漏补缺|学习机休息，检查未完成项目。",d.attitude],[d.g4Jump,d.g4Read,"查漏补缺|学习机休息，检查未完成项目。",d.attitude]],
      ["8月10日","周一",[d.g3Jump,d.g3Read,"阅读集训查漏|检查P7-P44是否全部完成并订正。","必备内容书写P32-33|完成第32-33页。","英语总复习|总复习三上、三下句型单词和四上预习单词。",d.g3Machine,d.attitude],[d.g4Jump,d.g4Read,"必备内容书写P32-33|完成必备内容第32-33页。","古诗61-75|完成第61-75首背诵默写。","小古文6|完成六篇小古文中的第6篇。",d.g4Machine,d.attitude]],
      ["8月11日","周二",[d.g3Jump,d.g3Read,"必备内容书写P34-35|完成第34-35页。","全部作业检查整理|检查阅读集训、读后感、英语默写、综合实践和书写材料。",d.g3Machine,d.attitude],[d.g4Jump,d.g4Read,"必备内容书写P34-35|完成必备内容第34-35页。","全部作业检查整理|检查数学17页、75首古诗、3篇作文、6篇小古文和英语默写。",d.g4Machine,d.attitude]]
    ];
    const fullHomework={
      grade3:["语文：35页必备内容打印页，每页约140字，30天内完成。","语文：阅读集训P7-P44共38页，每日约1页，完成后订正。","语文：每日课外阅读30分钟，阅读《古文观止来了》《世说新语来了》等。","语文：两篇约400字读后感，分别安排在7月27日和8月4日一天完成。","语文：每日读背四上必备内容，熟背四上必背课文段落、古诗、日积月累。","英语：复习默写三下1-8单元重点句型，复习默写三上句型和单词。","英语：预习并默写四上单词。","学习机：英语单词打卡和语文课程打卡，合计约1小时，周日休息。","综合实践：科学项目或幻想画、音乐电影观后感、美术欣赏、家务、信息自我介绍等。","运动：每天跳绳3组。"],
      grade4:["语文：35页下发字词/必备内容，每页约140字，30天内完成。","语文：默写75首古诗，按顺序推进。","语文：熟读成诵五上必备内容。","语文：三篇作文《暑假趣事》《我的××朋友》《二十年后的家乡》，各用一天完整完成。","语文：完成六篇小古文。","语文：课外阅读《古文观止来了》《世说新语来了》，每日20-30分钟。","数学：完成17页竖式计算和简便计算，并整理订正错题。","英语：默写学历案Unit1-8句子，预习五上单词并完成默写纸。","学习机：英语单词打卡和语文课程打卡，合计约1小时，周日休息。","运动：每天跳绳3组。"]
    };
    const plans=rawPlans.map(([date,weekday,grade3,grade4])=>({date,weekday,grade3:grade3.map(parseTask),grade4:grade4.map(parseTask)}));
    function parseTask(text){const [title,detail]=text.split("|");return{id:title.replace(/[^a-zA-Z0-9\u4e00-\u9fa5]+/g,"-"),title,detail};}
    function defaultState(){return{checked:{},spends:{grade3:[],grade4:[]}}}
    function loadState(){try{return Object.assign(defaultState(),JSON.parse(localStorage.getItem(storageKey)||"{}"))}catch{return defaultState()}}
    let state=loadState(), activeChild="grade3", dayIndex=getTodayIndex(), spendStars="0", spendNote="";
    function getTodayIndex(){const start=new Date("2026-07-13T00:00:00+08:00").getTime();const day=Math.floor((Date.now()-start)/86400000);return Math.min(plans.length-1,Math.max(0,day));}
    function keyOf(child,index,id){return child+":"+index+":"+id}
    function save(){localStorage.setItem(storageKey,JSON.stringify(state))}
    function allTasks(child){return plans.flatMap(p=>p[child])}
    function checkedCount(child){let count=0;plans.forEach((p,i)=>p[child].forEach(t=>{if(state.checked[keyOf(child,i,t.id)])count++}));return count}
    function stats(child){const completed=checkedCount(child),total=allTasks(child).length,spent=(state.spends[child]||[]).reduce((s,i)=>s+i.stars,0);return{earned:completed,spent,balance:completed-spent,completed,total,percent:total?Math.round(completed/total*100):0}}
    function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]))}
    function render(){
      const info=childInfo[activeChild], plan=plans[dayIndex], tasks=plan[activeChild], st3=stats("grade3"), st4=stats("grade4");
      const todayDone=tasks.filter(t=>state.checked[keyOf(activeChild,dayIndex,t.id)]).length;
      document.getElementById("app").innerHTML=`
        <header class="topbar"><div><p class="kicker">30天计划 · 7月13日-8月11日</p><h1>暑假作业打卡</h1></div><span class="badge">分开统计</span></header>
        <section class="accountGrid" aria-label="孩子账户">${accountHtml("grade3",st3)}${accountHtml("grade4",st4)}</section>
        <section class="dateCard"><button data-action="prev" aria-label="前一天">‹</button><div><span>第${dayIndex+1}天</span><strong>${plan.date} ${plan.weekday}</strong></div><button data-action="next" aria-label="后一天">›</button></section>
        <section class="card"><div class="sectionTitle"><div><p class="kicker">${info.name}</p><h2>今日打卡</h2></div><div class="todayScore"><strong>${todayDone}/${tasks.length}</strong><span>今日最多${tasks.length}★</span></div></div><div class="taskList">${tasks.map(taskHtml).join("")}</div></section>
        <section class="card spendCard"><div class="sectionTitle"><div><p class="kicker">${info.name}</p><h2>今日消费</h2></div><span class="smallPill">单独记账</span></div><div class="spendForm"><label>使用星星数<input inputmode="numeric" id="spendStars" value="${esc(spendStars)}"></label><label>使用途径<input id="spendNote" placeholder="例：20分钟动画" value="${esc(spendNote)}"></label><button data-action="addSpend">记录消费</button></div><div class="spendList">${spendHtml()}</div></section>
        <section class="card"><div class="sectionTitle"><div><p class="kicker">完整清单</p><h2>全部暑假作业</h2></div></div><ul class="homeworkList">${fullHomework[activeChild].map(i=>`<li>${esc(i)}</li>`).join("")}</ul></section>
        <section class="card"><div class="sectionTitle"><div><p class="kicker">30天安排</p><h2>每日任务详情</h2></div></div><div class="planList">${plans.map(planHtml).join("")}</div></section>
        <section class="note"><strong>奖励规则</strong><p>每日每项任务完成奖励1颗星，“按时开始 / 态度好”也奖励1颗星。星星、消费、余额、进度均按孩子单独统计。</p><p>${info.maxNormal}</p></section>`;
      bind();
    }
    function accountHtml(child,st){const i=childInfo[child];return`<button class="account ${activeChild===child?"active":""}" data-child="${child}" style="--accent:${i.color};--soft:${i.bg}"><span class="dot"></span><strong>${i.name}</strong><span class="balance">余额 ${st.balance}★</span><span>累计获得 <b>${st.earned}★</b></span><span>累计消费 <b>${st.spent}★</b></span><span>作业进度 <b>${st.percent}%</b></span><i class="bar"><em style="width:${st.percent}%"></em></i><small>${st.completed}/${st.total}项</small></button>`}
    function taskHtml(t){const done=state.checked[keyOf(activeChild,dayIndex,t.id)];return`<article class="taskItem ${done?"done":""}"><button data-task="${esc(t.id)}" aria-label="${done?"取消":"完成"}${esc(t.title)}">${done?"✓":""}</button><div><strong>${esc(t.title)}</strong><p>${esc(t.detail)}</p></div><span>+1★</span></article>`}
    function spendHtml(){const list=state.spends[activeChild]||[];if(!list.length)return"<p>今天还没有消费记录。</p>";return list.slice(0,5).map(i=>`<div><span>${esc(i.date)}</span><strong>-${i.stars}★</strong><em>${esc(i.note)}</em><button data-spend="${i.id}">删除</button></div>`).join("")}
    function planHtml(p,index){const done=p[activeChild].filter(t=>state.checked[keyOf(activeChild,index,t.id)]).length;return`<details ${index===dayIndex?"open":""}><summary><span>第${index+1}天 · ${p.date} ${p.weekday}</span><b>${done}/${p[activeChild].length}</b></summary><ol>${p[activeChild].map(t=>`<li>${esc(t.title)}：${esc(t.detail)}</li>`).join("")}</ol></details>`}
    function bind(){
      document.querySelectorAll("[data-child]").forEach(b=>b.onclick=()=>{activeChild=b.dataset.child;render()});
      document.querySelector('[data-action="prev"]').onclick=()=>{dayIndex=Math.max(0,dayIndex-1);render()};
      document.querySelector('[data-action="next"]').onclick=()=>{dayIndex=Math.min(plans.length-1,dayIndex+1);render()};
      document.querySelectorAll("[data-task]").forEach(b=>b.onclick=()=>{const k=keyOf(activeChild,dayIndex,b.dataset.task);state.checked[k]=!state.checked[k];save();render()});
      document.getElementById("spendStars").oninput=e=>{spendStars=e.target.value};
      document.getElementById("spendNote").oninput=e=>{spendNote=e.target.value};
      document.querySelector('[data-action="addSpend"]').onclick=()=>{const stars=parseInt(spendStars,10);if(!stars||stars<1||!spendNote.trim())return;state.spends[activeChild]=[{id:String(Date.now()),date:plans[dayIndex].date+" "+plans[dayIndex].weekday,stars,note:spendNote.trim()},...(state.spends[activeChild]||[])];spendStars="0";spendNote="";save();render()};
      document.querySelectorAll("[data-spend]").forEach(b=>b.onclick=()=>{state.spends[activeChild]=(state.spends[activeChild]||[]).filter(i=>i.id!==b.dataset.spend);save();render()});
    }
    render();
  </script>
</body>
</html>
